name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - name: Compute toolchain build-args from YMIR_VERSION
        id: toolchain
        run: |
          . ./YMIR_VERSION
          GCC_MAJOR_VERSION="$(echo "$GCC_VERSION" | cut -d. -f1)"
          echo "gyc_release_tag=${YMIR_BOOTSTRAP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyc_asset=gyc-${GCC_MAJOR_VERSION}_${YMIR_BOOTSTRAP_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "gyllir_release_tag=${GYLLIR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyllir_asset=gyllir_${GYLLIR_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "midgard_release_tag=${MIDGARD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "midgard_asset=midgard-${MIDGARD_VERSION}-src.zip" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: build
          push: false
          load: true
          tags: ymirc-build:ci
          build-args: |
            GYC_RELEASE_TAG=${{ steps.toolchain.outputs.gyc_release_tag }}
            GYC_ASSET=${{ steps.toolchain.outputs.gyc_asset }}
            GYLLIR_RELEASE_TAG=${{ steps.toolchain.outputs.gyllir_release_tag }}
            GYLLIR_ASSET=${{ steps.toolchain.outputs.gyllir_asset }}
            MIDGARD_RELEASE_TAG=${{ steps.toolchain.outputs.midgard_release_tag }}
            MIDGARD_ASSET=${{ steps.toolchain.outputs.midgard_asset }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests and collect coverage
        id: run_tests
        run: |
          set -o pipefail
          docker run --rm ymirc-build:ci ./ymirc.test -sf -cov | tee coverage.txt

      - name: Publish coverage summary
        if: always()
        run: |
          CLEAN="$(sed -E 's/\x1b\[[0-9;]*m//g' coverage.txt)"

          if [ "${{ steps.run_tests.outcome }}" = "success" ]; then
            HEADER_LINE="$(echo "$CLEAN" | grep -n 'COVERAGE' | head -1 | cut -d: -f1)"
            REPORT="$(echo "$CLEAN" | tail -n "+$((HEADER_LINE - 1))")"
            TOTAL_LINE="$(echo "$CLEAN" | grep -E 'TOTAL:' | tail -1)"
            TOTAL_PCT="$(echo "$TOTAL_LINE" | grep -oE '^\[[0-9]+%\]' | tr -d '[]')"
            TOTAL_NUM="${TOTAL_PCT%\%}"

            if [ -z "$TOTAL_NUM" ]; then
              BADGE_COLOR="lightgrey"
              TOTAL_NUM="unknown"
            elif [ "$TOTAL_NUM" -lt 50 ]; then
              BADGE_COLOR="red"
            elif [ "$TOTAL_NUM" -gt 95 ]; then
              BADGE_COLOR="brightgreen"
            else
              BADGE_COLOR="yellow"
            fi

            {
              echo "## Coverage ![coverage](https://img.shields.io/badge/coverage-${TOTAL_NUM}%25-${BADGE_COLOR})"
              echo
              echo '```'
              echo "$REPORT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Tests failed - no coverage report"
              echo
              echo '```'
              echo "$CLEAN"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
