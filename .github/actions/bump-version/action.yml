name: Bump version
description: Bumps the major/minor/patch segment of the `version` key in gyllir.toml, commits, and pushes.
inputs:
  part:
    description: Which segment to bump - "major", "minor", or "patch".
    required: true

runs:
  using: composite
  steps:
    - id: bump
      shell: bash
      run: |
        set -euo pipefail

        OLD_VERSION="$(bash .github/scripts/ymirc-version.sh)"
        IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"

        case "${{ inputs.part }}" in
          major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
          patch) PATCH=$((PATCH + 1)) ;;
          *) echo "Unknown part: ${{ inputs.part }}" >&2; exit 1 ;;
        esac

        NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

        # Rewrite only the first top-level `version` key - stop at the first [table] header so a
        # `version` under e.g. [dependencies.foo] is left alone. Same rule as ymirc-version.sh.
        awk -v new="$NEW_VERSION" '
          !done && /^[[:space:]]*\[/ { done = 1 }
          !done && /^[[:space:]]*version[[:space:]]*=/ {
            sub(/"[^"]*"/, "\"" new "\""); done = 1
          }
          { print }
        ' gyllir.toml > gyllir.toml.tmp
        mv gyllir.toml.tmp gyllir.toml

        # Guard against a silent no-op rewrite (e.g. a value the sub could not match).
        WRITTEN="$(bash .github/scripts/ymirc-version.sh)"
        if [ "$WRITTEN" != "$NEW_VERSION" ]; then
          echo "::error::Failed to write ${NEW_VERSION} into gyllir.toml (still reads ${WRITTEN})"
          exit 1
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add gyllir.toml
        git commit -m "chore: bump version ${OLD_VERSION} -> ${NEW_VERSION}"
        git push

        echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
